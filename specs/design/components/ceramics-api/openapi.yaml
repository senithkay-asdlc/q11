openapi: 3.0.3
info:
  title: Ceramics API
  description: Catalog, cart, checkout, and order API for the handmade ceramics storefront.
  version: 0.1.0
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: products
  - name: cart
  - name: checkout
  - name: orders
paths:
  /products:
    get:
      operationId: listProducts
      summary: List/search/filter products
      tags: [products]
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Keyword search on name/description
        - name: category
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
    post:
      operationId: createProduct
      summary: Create a product (administrator only)
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: Invalid product payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller is not an administrator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getProduct
      summary: Get a single product's detail
      tags: [products]
      security: []
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateProduct
      summary: Update a product (administrator only)
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: Invalid product payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller is not an administrator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteProduct
      summary: Delete a product (administrator only)
      tags: [products]
      responses:
        '204':
          description: Product deleted
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller is not an administrator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /cart:
    get:
      operationId: getCart
      summary: Get the signed-in shopper's cart
      tags: [cart]
      responses:
        '200':
          description: Current cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /cart/items:
    post:
      operationId: addCartItem
      summary: Add a product to the cart
      tags: [cart]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemInput' }
      responses:
        '201':
          description: Cart with the item added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400':
          description: Requested quantity exceeds available stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /cart/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateCartItem
      summary: Update a cart line item's quantity
      tags: [cart]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400':
          description: Requested quantity exceeds available stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Cart item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: removeCartItem
      summary: Remove a cart line item
      tags: [cart]
      responses:
        '204':
          description: Item removed
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Cart item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /checkout:
    post:
      operationId: checkout
      summary: Submit shipping and payment details and place the order
      tags: [checkout]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: Invalid checkout request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Insufficient stock or payment declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders:
    get:
      operationId: listOrders
      summary: List the signed-in shopper's past orders
      tags: [orders]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Paginated order list
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getOrder
      summary: Get a single order's detail and status
      tags: [orders]
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      schema: { type: string }
      description: Injected by the gateway from the caller's validated token; identifies the signed-in shopper or administrator.
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Product:
      type: object
      required: [id, name, price, category, stockQuantity]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        price: { type: number, format: float }
        imageUrls: { type: array, items: { type: string } }
        stockQuantity: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [name, price, category, stockQuantity]
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string }
        price: { type: number, format: float }
        imageUrls: { type: array, items: { type: string } }
        stockQuantity: { type: integer }
    CartItem:
      type: object
      required: [id, productId, quantity, unitPrice]
      properties:
        id: { type: string }
        productId: { type: string }
        productName: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number, format: float }
        subtotal: { type: number, format: float }
    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
    Cart:
      type: object
      required: [id, items, total]
      properties:
        id: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        total: { type: number, format: float }
        updatedAt: { type: string, format: date-time }
    ShippingAddress:
      type: object
      required: [name, line1, city, postalCode, country]
      properties:
        name: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        country: { type: string }
        phone: { type: string }
    CheckoutRequest:
      type: object
      required: [shippingAddress, paymentMethodToken]
      properties:
        shippingAddress: { $ref: '#/components/schemas/ShippingAddress' }
        paymentMethodToken:
          type: string
          description: Tokenized payment method reference from the payment provider
    OrderItem:
      type: object
      required: [productId, quantity, unitPrice, lineTotal]
      properties:
        productId: { type: string }
        productName: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number, format: float }
        lineTotal: { type: number, format: float }
    Order:
      type: object
      required: [id, status, items, subtotal, shippingCost, tax, total]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, confirmed, failed] }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        subtotal: { type: number, format: float }
        shippingCost: { type: number, format: float }
        tax: { type: number, format: float }
        total: { type: number, format: float }
        shippingAddress: { $ref: '#/components/schemas/ShippingAddress' }
        paymentReference: { type: string }
        createdAt: { type: string, format: date-time }
