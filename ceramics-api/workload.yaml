apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: ceramics-api

endpoints:
  - name: http
    type: HTTP
    port: 8080
    basePath: /
    visibility:
      - external

dependencies:
  resources:
    - ref: q11-payment-provider
      envBindings:
        PAYMENT_PROVIDER_API_KEY: PAYMENT_PROVIDER_API_KEY
    - ref: q11-ceramics-db
      envBindings:
        adminPassword: CERAMICS_DB_ADMINPASSWORD
        adminURL: CERAMICS_DB_ADMINURL
        database: CERAMICS_DB_DATABASE
        host: CERAMICS_DB_HOST
        password: CERAMICS_DB_PASSWORD
        port: CERAMICS_DB_PORT
        url: CERAMICS_DB_URL
        username: CERAMICS_DB_USERNAME
    - ref: q11-user-auth
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        scopes: USER_AUTH_SCOPES
